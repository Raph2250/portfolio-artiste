<!DOCTYPE html> 
<!--(Cette ligne indique au navigateur :« Ce document utilise la version moderne de HTML, c'est-à-dire HTML5. »)-->
<html lang="fr"> <!--(indique le début de toute la page HTML et indique que la langue principale de la page est le français.)-->

   <head>
       <meta charset="UTF-8"> 
     <!--(Cette ligne indique au navigateur comment
        lire les caractères utilisés dans la page.)-->
   
       <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
     <!--(Cette ligne est très importante pour que le site fonctionne correctement sur ordinateur, tablette et téléphone.)-->
   
       <meta name="description" content="Portfolio artistique d'un étudiant en art.">
      <!-- (Cette ligne donne une courte description de la page.)-->
   
       <title>Portfolio : Étudiant en Art</title> <!--(définit le titre de la page.)-->
   
       <link rel="stylesheet" href="style.css"> 
     <!--(Cette ligne permet de connecter le fichier HTML au fichier CSS.)-->
   </head> 
   <body> <!--(contient tout le contenu visible de la page web.)-->
       
       <header class="navbar"> <!--(représente l'en-tête de la page.Ici, il contient le menu de navigation.-->
       
           <a href="#accueil" class="logo"> <!--(Cela signifie :« Lorsque je clique sur  ce lien, va vers l'élément qui possède id="accueil". »)-->
               ALEX<span>.</span>
           </a>
       
           <nav>
               <a href="#apropos">À propos</a>
               <a href="#travaux">Travaux</a>
               <a href="#parcours">Parcours</a>
               <a href="#contact">Contact</a>
           </nav>
       
       </header>
      
      <main> <!--(Voici le contenu principal de ma page.)-->
              <section class="hero" id="accueil"> <!--(permet de créer une grande partie de la page.)-->
      
              <div class="hero-content">
                  <p class="small-label">
                      Étudiant en art · Abidjan
                  </p>
      
                  <h1>
                      Je transforme
                      <em>mes idées</em>  <!--(permet de mettre en évidence une partie du texte.)-->
                      en images.
                  </h1>
      
                  <p class="hero-description">
                      Je suis étudiant en art et j'explore la peinture,
                      le dessin, la photographie et les formes contemporaines
                      pour raconter des histoires autrement.
                  </p>
      
                  <a href="#travaux" class="button">
                      Découvrir mes travaux
                      <span>↓</span>
                  </a>
      
              </div>
      
      
              <div class="hero-image">
      
                  <img
                      src="images/oeuvre-1.jpg"
                      alt="Œuvre principale de l'artiste"
                  >
      
                  <div class="hero-caption">
                      <span>01</span>
                      <span>Étude abstraite · 2026</span>
                  </div>
      
              </div>
      
          </section>
          
         </main>
   
   </body>
</html>
